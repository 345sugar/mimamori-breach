name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Offline tests including Windows DPAPI and instance lock
        run: python -m unittest discover -s tests -v
      - name: Offline GUI smoke test
        run: python -m mimamori_breach --smoke-test
  windows-build:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[build]'
      - name: Bundle Windows application
        run: python -m PyInstaller --noconfirm --windowed --onedir --name MimamoriBreach --paths src launcher.py
      - name: Test bundled application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/MimamoriBreach/MimamoriBreach.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Bundled application smoke test failed.' }
      - name: Include documentation, licenses, and pystray source
        run: python scripts/collect_bundle_materials.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MimamoriBreach-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 30
